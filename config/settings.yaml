project:
  name: hci-hai-program-database
  python_version: '3.11+'
paths:
  schema: schema/manual_csv_schemas.yaml
  manual_data: data/manual
  reports: reports
validation:
  allowed_entity_types:
    - university
    - program
    - faculty
    - lab
  allowed_confidence:
    - low
    - medium
    - high
  allowed_review_statuses:
    - discovered
    - needs_source
    - needs_review
    - reviewed
    - promoted
    - rejected
  allowed_relevant_areas:
    - core_hci
    - human_ai_interaction
    - human_centered_ai
    - social_computing
    - responsible_ai
    - computational_social_science
    - accessibility
    - human_robot_interaction
    - mixed_methods_uxr
    - ai_product_evaluation
    - other
  fuzzy_duplicate_threshold: 90
