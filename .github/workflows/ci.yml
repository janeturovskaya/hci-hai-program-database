name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate manual and candidate data
        run: python scripts/validate_manual_data.py

      - name: Generate candidate review report
        run: python scripts/generate_candidate_review.py

      - name: Run tests
        run: python -m unittest discover
